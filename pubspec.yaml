name: torneo_cancelado
description: "El Torneo del Cancelado - concurso de estrellas diarias"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.5.1

  # Base de datos local
  path_provider: ^2.1.3

  # Audio
  audioplayers: ^6.0.0

  # Animaciones
  flutter_animate: ^4.5.0

  # Responsive
  responsive_framework: ^1.5.1

  # Utilidades
  uuid: ^4.4.0
  intl: ^0.20.3
  collection: ^1.18.0
  equatable: ^2.0.5
  dartz: ^0.10.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/lottie/

flutter_launcher_icons:
  android: "launcher_icon" # Nombre del recurso en Android
  ios: true
  image_path: "assets/icon/app_icon.png" # Ruta a tu imagen 1024x1024
  min_sdk_android: 21 # Recomendado para iconos adaptativos

  # Configuración para iconos adaptativos de Android (Android 8.0+)
  adaptive_icon_background: "#1A1A2E" # Color de fondo (usando tu AppColors)
  adaptive_icon_foreground: "assets/icon/app_icon.png" # Tu imagen como primer plano[reference:3]
